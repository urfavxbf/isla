name: Isla Lab Android APK

on:
  push:
    branches: [experiment/isla-smartisland]
    paths:
      - 'isla-lab/**'
      - '.github/workflows/isla-lab-build.yml'
  pull_request:
    paths:
      - 'isla-lab/**'
      - '.github/workflows/isla-lab-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-debug:
    name: Build complete Isla Lab
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile full Island app
        working-directory: isla-lab
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Isla-Lab-debug
          path: isla-lab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
