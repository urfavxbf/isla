name: Rebrand Isla Lab and validate build

on:
  push:
    branches:
      - experiment/isla-smartisland
    paths:
      - 'tools/rebrand_isla_lab.py'
      - '.github/workflows/isla-lab-rebrand.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isla-rebrand
  cancel-in-progress: false

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply full brand migration
        run: python3 tools/rebrand_isla_lab.py
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Isla-branded APK before committing
        working-directory: isla-lab
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Publish rebranding commit only after successful compilation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- isla-lab
          if git diff --cached --quiet; then
            echo "No rebranding changes; already up to date."
          else
            git commit -m "feat(isla-lab): complete original app rebranding with GPL attribution"
            git push origin HEAD:refs/heads/experiment/isla-smartisland
          fi
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: Isla-fully-branded-debug
          path: isla-lab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
