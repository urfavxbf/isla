name: Import and build Isla Lab

on:
  push:
    branches:
      - experiment/isla-smartisland
    paths:
      - '.github/workflows/isla-lab-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isla-lab-import
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_COMMIT: 149efd1fde40416b93116ee7c958c2793a5d4459
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import pinned, complete upstream source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f isla-lab/UPSTREAM_PROVENANCE.md ]; then
            echo "Upstream source already imported. Skipping repeat import."
            exit 0
          fi

          git clone --quiet --filter=blob:none --no-checkout https://github.com/agupta07505/SmartIsland.git "$RUNNER_TEMP/SmartIsland"
          git -C "$RUNNER_TEMP/SmartIsland" checkout --quiet "$UPSTREAM_COMMIT"
          test "$(git -C "$RUNNER_TEMP/SmartIsland" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          mkdir -p isla-lab
          # Never import third-party GitHub workflows or its Git repository.
          rsync -a --delete --exclude='.git' --exclude='.github' "$RUNNER_TEMP/SmartIsland/" isla-lab/
          test -f isla-lab/LICENSE
          grep -q 'GNU GENERAL PUBLIC LICENSE' isla-lab/LICENSE
          test -f isla-lab/gradlew
          test -f isla-lab/app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path

          base = Path("isla-lab")
          build = base / "app/build.gradle.kts"
          raw = build.read_text()
          old_id = 'applicationId = "com.agupta07505.smartisland"'
          assert raw.count(old_id) == 1, "Upstream applicationId changed; manual audit required"
          raw = raw.replace(old_id, 'applicationId = "com.pao.isla.lab"')
          build.write_text(raw)

          settings = base / "settings.gradle.kts"
          raw = settings.read_text()
          old_root = 'rootProject.name = "Smart Island"'
          assert raw.count(old_root) == 1, "Upstream project name changed; manual audit required"
          settings.write_text(raw.replace(old_root, 'rootProject.name = "Isla Lab"'))

          strings = base / "app/src/main/res/values/strings.xml"
          raw = strings.read_text()
          old_name = '<string name="app_name">Smart Island</string>'
          assert raw.count(old_name) == 1, "Upstream label changed; manual audit required"
          strings.write_text(raw.replace(old_name, '<string name="app_name">Isla Lab</string>'))

          provenance = base / "UPSTREAM_PROVENANCE.md"
          provenance.write_text("""# Isla Lab upstream provenance

          Based on [SmartIsland](https://github.com/agupta07505/SmartIsland),
          upstream commit `149efd1fde40416b93116ee7c958c2793a5d4459`.

          Original copyright (C) Animesh Gupta and contributors.
          Licensed under GNU GPL v3. See LICENSE and retained source notices.

          Isla experimental modifications: separate applicationId
          `com.pao.isla.lab`, app title `Isla Lab`, Gradle project title
          `Isla Lab`. All other original source content is imported as-is,
          excluding upstream GitHub workflows and Git history.

          This is a derivative work. Branding does not transfer ownership
          or waive the obligations of GPL-3.0. Any released derivative
          must provide appropriate license and corresponding source.
          """.replace("          ", ""))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- isla-lab
          if git diff --cached --quiet; then
            echo "No imported source change."
          else
            git commit -m "feat(lab): import pinned SmartIsland as isolated Isla Lab"
            git push origin "HEAD:refs/heads/experiment/isla-smartisland"
          fi

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble full Isla Lab debug APK
        working-directory: isla-lab
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Preserve installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: isla-lab-debug-apk
          path: isla-lab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
